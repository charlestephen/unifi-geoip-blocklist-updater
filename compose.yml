services:
  geoip-updater:
    image: ghcr.io/charlestephen/unifi-geoip-blocklist-updater:latest@sha256:2a995aaa6064a3320d5a8b9690c0ba36f3d7f000bf193e80a9abfed20fe82bd5
    # To build from source instead, drop `image:` and use:
    #   build:
    #     context: .
    #     dockerfile: Containerfile
    container_name: unifi-geoip-blocklist-updater
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/config:ro
      - geoip-data:/data

volumes:
  geoip-data:
